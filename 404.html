<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Impact Self Defense Academy Agra</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=DM+Serif+Display&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0d6efd;
      --color-accent:  #33BDFF;
      --color-dark:    #1D1F1F;
      --font-brand:    'Black Ops One', cursive;
      --font-heading:  'DM Serif Display', serif;
    }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--color-dark);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .error-page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 1rem;
    }
    .error-number {
      font-family: var(--font-brand);
      font-size: clamp(6rem, 20vw, 12rem);
      color: var(--color-accent);
      line-height: 1;
      margin-bottom: 0;
    }
    .error-title {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin-bottom: 1rem;
    }
    .error-desc {
      font-size: 1.05rem;
      color: rgba(255,255,255,0.65);
      max-width: 440px;
      margin: 0 auto 2rem;
    }
    .footer-bar {
      background: #111;
      padding: 1rem;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <main class="error-page">
    <div>
      <p class="error-number" aria-hidden="true">404</p>
      <h1 class="error-title">Page Not Found</h1>
      <p class="error-desc">
        Looks like this page took a wrong turn. Let's get you back on the mat.
      </p>
      <a href="/" class="btn btn-primary btn-lg me-2">Go to Homepage</a>
      <a href="/#contact" class="btn btn-outline-light btn-lg">Contact Us</a>
    </div>
  </main>
  <div class="footer-bar">
    &copy; <script>document.write(new Date().getFullYear())</script> Impact Self Defense Academy, Agra
  </div>
</body>
</html>
